    <text style="fill: #536575; font: 10.5px 'DejaVu Sans'; text-anchor: start" x="370.08" y="677.7072" transform="rotate(-0 370.08 677.7072)">Upper servo: MOTOR +5 V and GND labels join the corresponding power rails.</text>
   </g>
   <g id="text_32">
    <text style="fill: #183044; font: 10.5px 'DejaVu Sans'" transform="translate(812.448 574.674492)">1000 µF, ≥10 V</text>
    <text style="fill: #183044; font: 10.5px 'DejaVu Sans'" transform="translate(812.448 586.432195)">+ toward motor +5 V</text>
   </g>
   <g id="text_33">
    <text style="fill: #c23f37; font: 13px 'DejaVu Sans'; text-anchor: start" x="761.2992" y="554.0328" transform="rotate(-0 761.2992 554.0328)">+</text>
   </g>
   <g id="text_34">
    <text style="fill: #2366b1; font: 700 15px 'DejaVu Sans'; text-anchor: middle" x="167.904" y="341.010056" transform="rotate(-0 167.904 341.010056)">OPTIONAL LCD / STOP</text>
   </g>
   <g id="text_35">
    <text style="fill: #183044; font: 12.5px 'DejaVu Sans'" transform="translate(66.483102 378.179641)">LCD VCC → Uno 5V; GND → GND</text>
    <text style="fill: #183044; font: 12.5px 'DejaVu Sans'" transform="translate(89.482125 394.551419)">LCD SDA → A4; SCL → A5</text>
    <text style="fill: #183044; font: 12.5px 'DejaVu Sans'" transform="translate(83.801461 410.923196)">NO stop button: D2 → GND</text>
   </g>
   <g id="text_36">
    <text style="fill: #183044; font: 12px 'DejaVu Sans'; text-anchor: start" x="56.9664" y="718.7004" transform="rotate(-0 56.9664 718.7004)">SIGNAL: blue     MOTOR +5 V: red     GND: gray     • dots = joins; crossing without a dot = no join</text>
   </g>
   <g id="text_37">
    <text style="fill: #c23f37; font: 12px 'DejaVu Sans'; text-anchor: start" x="56.9664" y="748.5768" transform="rotate(-0 56.9664 748.5768)">Short 18 AWG power trunk; rated connectors. No motor power through Uno, USB, Vin, Dupont leads or breadboard.</text>
   </g>
